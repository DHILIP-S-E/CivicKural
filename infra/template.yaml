AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: WardWatch — DynamoDB, S3, and the two scheduled sweep Lambdas.

Parameters:
  TableName:
    Type: String
    Default: wardwatch
  BucketName:
    Type: String
    Default: wardwatch-media-dev
  ReasoningModelId:
    Type: String
    Default: apac.anthropic.claude-sonnet-4-20250514-v1:0
  VisionModelId:
    Type: String
    Default: apac.anthropic.claude-sonnet-4-20250514-v1:0

Globals:
  Function:
    Runtime: python3.11
    Timeout: 300
    MemorySize: 512
    Environment:
      Variables:
        WARDWATCH_TABLE: !Ref TableName
        WARDWATCH_BUCKET: !Ref BucketName
        BEDROCK_REASONING_MODEL_ID: !Ref ReasoningModelId
        BEDROCK_VISION_MODEL_ID: !Ref VisionModelId

Resources:
  ComplaintsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
        - { AttributeName: gsi2pk, AttributeType: S }
        - { AttributeName: gsi2sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: gsi2
          KeySchema:
            - { AttributeName: gsi2pk, KeyType: HASH }
            - { AttributeName: gsi2sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SweepPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [dynamodb:Query, dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
            Resource:
              - !GetAtt ComplaintsTable.Arn
              - !Sub "${ComplaintsTable.Arn}/index/*"
          - Effect: Allow
            Action: [s3:GetObject, s3:PutObject]
            Resource: !Sub "${MediaBucket.Arn}/*"
          - Effect: Allow
            Action: [bedrock:InvokeModel]
            Resource: "*"
          - Effect: Allow
            Action: [ses:SendEmail]
            Resource: "*"

  EscalationSweepFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: wardwatch.schedulers.escalation_sweep.handler
      CodeUri: ../backend
      Policies: [!Ref SweepPolicy]
      Events:
        Every6h:
          Type: Schedule
          Properties:
            Schedule: rate(6 hours)

  PatternSweepFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: wardwatch.schedulers.pattern_sweep.handler
      CodeUri: ../backend
      Policies: [!Ref SweepPolicy]
      Events:
        Weekly:
          Type: Schedule
          Properties:
            Schedule: rate(7 days)

Outputs:
  TableName:
    Value: !Ref ComplaintsTable
  BucketName:
    Value: !Ref MediaBucket
